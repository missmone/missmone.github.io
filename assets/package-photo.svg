<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Package photo">
  <defs>
    <linearGradient id="bgDesk" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e4ddd2"/>
      <stop offset="35%" stop-color="#d7c8b5"/>
      <stop offset="100%" stop-color="#b89774"/>
    </linearGradient>
    <linearGradient id="boxShade" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="45%" stop-color="#f4f3f0"/>
      <stop offset="100%" stop-color="#d9d4ce"/>
    </linearGradient>
    <linearGradient id="kraftShadow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f2f1ee"/>
      <stop offset="100%" stop-color="#d8d2ca"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d9372a"/>
      <stop offset="100%" stop-color="#a71513"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="blurBg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bgDesk)"/>

  <g opacity="0.32" filter="url(#blurBg)">
    <rect x="0" y="0" width="1200" height="900" fill="#dcd4c8"/>
    <ellipse cx="990" cy="160" rx="180" ry="120" fill="#b7b0c7"/>
    <ellipse cx="370" cy="130" rx="210" ry="120" fill="#d7d1ce"/>
  </g>

  <g transform="translate(150 138)" filter="url(#softShadow)">
    <polygon points="0,0 760,0 800,80 840,90 840,505 780,560 80,560 0,500" fill="url(#boxShade)"/>
    <polygon points="760,0 840,90 840,505 780,560 780,55" fill="#ded9d4" opacity="0.7"/>
    <polygon points="0,500 80,560 780,560 700,505 0,505" fill="#d5d0c9"/>

    <g>
      <polygon points="160,90 670,90 700,130 120,130" fill="#edf0ef" opacity="0.7"/>
      <polygon points="95,146 160,90 120,130 60,188" fill="#f3f1ee" opacity="0.7"/>
      <polygon points="645,90 700,130 770,195 740,205 680,150" fill="#e4e1dc" opacity="0.85"/>
    </g>

    <g transform="translate(120 130)">
      <g transform="translate(0 0)">
        <rect x="0" y="0" width="600" height="350" fill="#f6f5f2" rx="10"/>
        <rect x="40" y="30" width="520" height="290" fill="rgba(255,255,255,0.3)" rx="10"/>
        <g transform="translate(68 38)">
          <rect x="0" y="0" width="135" height="20" fill="#d5d3cf"/>
          <rect x="0" y="35" width="145" height="16" fill="#dcd8d3"/>
          <rect x="0" y="66" width="115" height="18" fill="#d6d3cf"/>
          <rect x="0" y="100" width="98" height="16" fill="#d1d0cc"/>
        </g>
      </g>
    </g>

    <g transform="translate(60 220) rotate(-15 160 140)">
      <text x="0" y="180" font-family="Arial, sans-serif" font-weight="700" font-size="118" fill="#c22e2b" letter-spacing="-8">Fed</text>
      <text x="112" y="180" font-family="Arial, sans-serif" font-weight="700" font-size="118" fill="#2b2b2b" letter-spacing="-8">Ex</text>
      <rect x="18" y="24" width="240" height="30" fill="none" stroke="#2b2b2b" stroke-width="4" opacity="0.5"/>
    </g>

    <g transform="translate(550 180) rotate(10 160 50)">
      <text x="0" y="120" font-family="Arial, sans-serif" font-weight="700" font-size="72" fill="#2f2f2f" opacity="0.9">FEDEX</text>
    </g>

    <g transform="translate(70 432)">
      <rect x="0" y="0" width="710" height="72" fill="rgba(255,255,255,0.36)" rx="9"/>
      <text x="355" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d1d1d" letter-spacing="1.5">LABEL</text>
    </g>
  </g>

  <g opacity="0.9">
    <ellipse cx="1018" cy="147" rx="72" ry="120" fill="#dfe7df"/>
    <ellipse cx="1010" cy="154" rx="52" ry="95" fill="#ebf0ea"/>
    <path d="M995 221 C1015 190, 1018 150, 1042 116 C1074 150, 1058 194, 1042 222 Z" fill="#3c7a4e"/>
    <path d="M1030 227 C1038 188, 1080 152, 1100 125 C1116 160, 1105 196, 1079 230 Z" fill="#3c7a4e"/>
  </g>
</svg>
